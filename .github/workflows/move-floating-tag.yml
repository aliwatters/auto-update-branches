name: Move Floating Tag

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move major version tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          MAJOR="${VERSION%%.*}"
          git tag -f "$MAJOR" "$VERSION"
          git push --force origin "$MAJOR"
